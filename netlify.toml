# Netlify deployment for the TanStack Start (Nitro) build.
# NITRO_PRESET switches the server build from the default Cloudflare target
# to Netlify Functions, so SSR routes and /api endpoints keep working.
[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"
  NITRO_PRESET = "netlify"

# Long-cache immutable build output, but keep brand assets revalidating.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Lovable CDN assets (logo, founder photo, Bangla fonts, July 36 PDF) are served
# from /__l5e/assets-v1/* by Lovable hosting. Proxy them so the Netlify deploy
# resolves the exact same URLs.
[[redirects]]
  from = "/__l5e/assets-v1/*"
  to = "https://protidhwani.lovable.app/__l5e/assets-v1/:splat"
  status = 200
  force = true
